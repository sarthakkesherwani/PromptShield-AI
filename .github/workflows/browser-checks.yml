name: Browser detector checks
on:
  push:
    branches: [smart-local-detector]
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'package*.json', '.github/workflows/browser-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:model
      - run: npm run test:export
      - run: npm run build
